services:
  beliel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Dockploy puede cambiar BELIEL_PORT desde las variables del servicio.
      - "127.0.0.1:${BELIEL_PORT:-18080}:80"
    expose:
      - "80"
    volumes:
      - beliel_leaderboard:/app/data
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      BELIEL_DATA_KEY: "${BELIEL_DATA_KEY}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  beliel_leaderboard:
